services:
  server:
    container_name: obscura-server
    build:
      context: .
      dockerfile: Dockerfile

    # Load all variables from .env
    env_file:
      - .env

    environment:
      NODE_ENV: production
      # This will come from .env → DATABASE_URL=...
      DATABASE_URL: ${DOCKER_DATABASE_URL}

    ports:
      - "3000:3000"

    restart: unless-stopped

    depends_on:
      - db

  db:
    image: postgres:16
    container_name: obscura-db

    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pgdata:/var/lib/postgresql/data

    ports:
      - "5432:5432"

volumes:
  pgdata:
