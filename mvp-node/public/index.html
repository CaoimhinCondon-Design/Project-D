<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Project David — Node MVP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
      .wrap { max-width: 720px; margin: 0 auto; }
      button { padding: 10px 14px; border-radius: 8px; border: none; cursor: pointer; }
      .primary { background: #111; color: #fff; }
      .danger { background: #b91c1c; color: #fff; }
      .card { border: 1px solid #eee; border-radius: 10px; padding: 12px; margin-top: 12px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .row { display: flex; gap: 10px; align-items: center; }
    </style>
  </head>

  <body>
    <div class="wrap">
      <h1>Project David — Minimal Node.js MVP</h1>
      <p>Press <b>Start Recording</b>, speak, then <b>Stop & Send</b>. You’ll get a transcript, an answer, and a short audio summary.</p>

      <div class="row">
        <button id="startBtn" class="primary">🎙️ Start Recording</button>
        <button id="stopBtn" class="danger" disabled>⏹️ Stop & Send</button>
        <span id="status">Idle</span>
      </div>

      <div class="card">
        <div><b>Transcript</b></div>
        <pre id="transcript" class="mono"></pre>
      </div>

      <div class="card">
        <div><b>Answer</b></div>
        <pre id="answer" class="mono"></pre>
      </div>

      <div class="card">
        <div><b>Spoken Summary</b></div>
        <audio id="audio" controls></audio>
      </div>
    </div>

    <script>
      let mediaRecorder;
      let chunks = [];
      let recording = false;

      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const statusEl = document.getElementById("status");
      const transcriptEl = document.getElementById("transcript");
      const answerEl = document.getElementById("answer");
      const audioEl = document.getElementById("audio");

      startBtn.onclick = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
            ? 'audio/webm;codecs=opus'
            : undefined;
          mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
          chunks = [];
          mediaRecorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
          mediaRecorder.onstop = () => { recording = false; statusEl.textContent = "Stopped"; };
          mediaRecorder.start();
          recording = true;
          statusEl.textContent = "Recording…";
          startBtn.disabled = true;
          stopBtn.disabled = false;
        } catch (e) {
          alert("Microphone permission is required.");
          console.error(e);
        }
      };

      stopBtn.onclick = async () => {
        if (!mediaRecorder || !recording) return;
        mediaRecorder.stop();
        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusEl.textContent = "Processing…";

        // Wait a tick for data to flush
        setTimeout(async () => {
          const blob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
          const base64 = await blobToBase64(blob);

          try {
            const resp = await fetch("/api/message", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ audioBase64: base64 })
            });
            const data = await resp.json();
            transcriptEl.textContent = data.transcript || "";
            answerEl.textContent = data.answer || "";
            if (data.ttsDataUrl) {
              audioEl.src = data.ttsDataUrl;
              // browsers need a user gesture; but since user clicked Stop & Send, play may work:
              try { await audioEl.play(); } catch {}
            }
            statusEl.textContent = "Done";
          } catch (e) {
            console.error(e);
            statusEl.textContent = "Error";
            alert("Something went wrong.");
          }
        }, 50);
      };

      async function blobToBase64(blob) {
        const buf = await blob.arrayBuffer();
        // Convert ArrayBuffer -> base64 safely in browser
        let binary = "";
        const bytes = new Uint8Array(buf);
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          const chunk = bytes.subarray(i, i + chunkSize);
          binary += String.fromCharCode(...chunk);
        }
        return btoa(binary);
      }
    </script>
  </body>
</html>
