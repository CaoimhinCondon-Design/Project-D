<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Project David - Node MVP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <main class="app layout">
      <!-- Sidebar: chat history -->
      <aside class="sidebar" aria-label="Chat history">
        <header class="sidebar__header">
          <h2 class="sidebar__title">Chats</h2>
          <div class="sidebar__actions">
            <button id="newChatBtn" class="button" type="button">New Chat</button>
            <button id="deleteChatBtn" class="button button--danger" type="button">Delete</button>
          </div>
        </header>

        <nav class="chat-list" id="chatList" aria-label="Chats">
          <!-- Populated by app.js -->
        </nav>
      </aside>

      <!-- Main: conversation -->
      <section class="chat">
        <header class="chat__header">
          <h1 class="chat__title" id="chatTitle">Project David</h1>
          <span id="status" class="panel__status" data-state="idle">Idle</span>
        </header>

        <!-- Messages -->
        <section id="messages" class="messages" aria-live="polite" aria-relevant="additions">
          <!-- Bubbles get appended here -->
        </section>

        <!-- Bottom controls -->
        <footer class="composer" role="region" aria-label="Recording Controls">
          <form id="textComposer" class="composer__form" autocomplete="off">
            <input
              id="textInput"
              class="composer__input"
              type="text"
              name="textInput"
              placeholder="Type a message..."
              aria-label="Type a message"
            />
            <button id="sendTextBtn" class="button" type="submit">Send</button>
          </form>
          <div class="btn-group">
            <button id="startBtn" class="button" type="button">Start Recording</button>
            <button id="stopBtn" class="button button--danger" type="button" disabled>Stop &amp; Send</button>
            <button id="voiceToggle" class="button" type="button">Enable Voice</button>
            <div class="voice-controls">
            <label class="volume-control" for="volumeSlider">
              <span class="volume-control__label">Volume</span>
              <input
                id="volumeSlider"
                class="volume-control__slider"
                type="range"
                min="0"
                max="1"
                step="0.05"
                value="1"
              />
            </label>
            <audio id="audio" hidden></audio>
          </div>
          </div>
        </footer>

      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
