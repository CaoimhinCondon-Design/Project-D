<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Project David - Node MVP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  
  <body>
    <main class="app">
      <header class="hero">
        <h1 class="hero__title">Project David - Minimal Node.js MVP</h1>
        <p class="hero__lead">
          Press <strong>Start Recording</strong>, speak, then <strong>Stop &amp; Send</strong>. You will receive a transcript,
          an answer, and a short audio summary.
        </p>
      </header>

      <section class="panel">
        <span id="status" class="panel__status" data-state="idle">Idle</span>
        <div class="btn-group">
          <button id="startBtn" class="button" type="button">Start Recording</button>
          <button id="stopBtn" class="button button--danger" type="button" disabled>Stop &amp; Send</button>
          <button id="voiceToggle" class="button" type="button">Enable Voice</button>
        </div>
      </section>

      <section class="stack">
        <article class="card">
          <h2 class="card__title">Transcript</h2>
          <pre id="transcript" class="card__body" data-empty="true">Waiting for transcript...</pre>
        </article>

        <article class="card">
          <h2 class="card__title">Answer</h2>
          <pre id="answer" class="card__body" data-empty="true">Waiting for answer...</pre>
        </article>

        <article class="card audio-player">
          <h2 class="card__title">Spoken Summary</h2>
          <audio id="audio" controls hidden></audio>
        </article>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
